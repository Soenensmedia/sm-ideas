<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SM-Ideas</title>
<meta name="theme-color" content="#15130f">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%E2%9C%B3%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.8/dist/umd/supabase.js"></script>
</head>
<body>

<!-- ══════════ LOGIN ══════════ -->
<div id="login-view">
  <div class="login-box">
    <div class="login-brand">
      <div class="brand-mark">✳</div>
      <div class="brand-name">SM-Ideas</div>
    </div>
    <form id="login-form">
      <div class="field">
        <label for="login-email">E-mail</label>
        <input type="email" id="login-email" required autocomplete="username">
      </div>
      <div class="field">
        <label for="login-password">Wachtwoord</label>
        <input type="password" id="login-password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-gold" style="width:100%" id="login-submit">Inloggen</button>
      <div class="login-error" id="login-error"></div>
    </form>
    <div class="login-toggle">
      <span id="login-toggle-text">Nog geen account?</span> <a id="login-toggle-link">Account aanmaken</a>
    </div>
  </div>
</div>

<!-- ══════════ APP ══════════ -->
<div id="app-shell" class="hidden">
  <div class="topbar">
    <div class="topbar-left">
      <span class="brand-mark">✳</span>
      <span class="brand-name">SM-Ideas</span>
    </div>
    <button class="btn btn-ghost btn-small" id="logout-btn">Uitloggen</button>
  </div>

  <main>
    <div id="notes-container"></div>
  </main>
</div>

<div id="modal-root"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
